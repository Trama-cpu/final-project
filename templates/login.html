{% extends 'plantilla.html' %}

{% block title %}Inicio de Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">

        <h2 class="mb-4">Iniciar Sesión</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text"
                       name="usuario"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Ingresar
            </button>

        </form>

        {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
